[project]
name = "payment-processing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "faststream[rabbit]>=0.6,<0.7", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
