name: payment-processing

x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
    API_KEY: ${API_KEY:?Copy .env.example to .env and set API_KEY}
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-55672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-55673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.api:create_app --factory --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${API_PORT:-58000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/openapi.json',headers={'X-API-Key':os.environ['API_KEY']}),timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  consumer:
    <<: *app
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
